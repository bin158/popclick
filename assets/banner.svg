<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="glowBlue" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="20" fill="url(#glowBlue)" />
  <rect width="1200" height="420" rx="20" fill="url(#glowPurple)" />
  <rect x="0.5" y="0.5" width="1199" height="419" rx="19.5" stroke="#ffffff" stroke-opacity="0.1" />

  <!-- App Icon Card -->
  <g filter="url(#shadowFilter)" transform="translate(100, 110)">
    <rect width="100" height="100" rx="24" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />
    <!-- Cursor pointer + Sparkles icon -->
    <path d="M36 28 L36 68 L48 56 L62 76 L70 70 L56 50 L72 50 Z" fill="#ffffff" fill-opacity="0.95" />
    <circle cx="70" cy="30" r="4" fill="#60a5fa" />
    <circle cx="78" cy="40" r="2.5" fill="#a78bfa" />
    <circle cx="82" cy="24" r="2" fill="#f472b6" />
  </g>

  <!-- Title & Subtitle -->
  <text x="230" y="155" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="48" font-weight="800" fill="#ffffff" letter-spacing="-1">
    PopClick
  </text>
  <text x="430" y="155" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="url(#accentGrad)" letter-spacing="1">
    ✦ NOVA EDITION
  </text>

  <text x="230" y="195" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
    Ultra-Modern Native macOS Text Action Launcher &amp; AI Productivity Utility
  </text>

  <!-- Feature Badges -->
  <g transform="translate(230, 235)">
    <!-- Badge 1: macOS Native -->
    <rect x="0" y="0" width="135" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#38bdf8"> macOS 13+</text>

    <!-- Badge 2: Swift 6 + AppKit -->
    <rect x="145" y="0" width="150" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="162" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#f97316">⚡ Swift 6 / AppKit</text>

    <!-- Badge 3: KaTeX LaTeX -->
    <rect x="305" y="0" width="130" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="323" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#a855f7">∑ KaTeX LaTeX</text>

    <!-- Badge 4: Code Highlighting -->
    <rect x="445" y="0" width="165" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="462" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#34d399">⌨ Syntax Highlight</text>

    <!-- Badge 5: 100% Offline -->
    <rect x="620" y="0" width="125" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="638" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#ec4899">🔒 100% Offline</text>

    <!-- Badge 6: Zero Electron -->
    <rect x="755" y="0" width="130" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="772" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🚫 Zero Electron</text>
  </g>

  <!-- Interactive Floating Capsule Preview -->
  <g filter="url(#shadowFilter)" transform="translate(230, 295)">
    <rect width="640" height="54" rx="27" fill="#0f172a" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />

    <!-- Button: Copy -->
    <g transform="translate(16, 12)">
      <rect width="70" height="30" rx="8" fill="#ffffff" fill-opacity="0.08" />
      <text x="14" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#ffffff">📋 Copy</text>
    </g>

    <!-- Button: Search -->
    <g transform="translate(94, 12)">
      <rect width="80" height="30" rx="8" fill="#ffffff" fill-opacity="0.08" />
      <text x="14" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#ffffff">🔍 Search</text>
    </g>

    <!-- Button: Translate -->
    <g transform="translate(182, 12)">
      <rect width="90" height="30" rx="8" fill="#ffffff" fill-opacity="0.08" />
      <text x="14" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#ffffff">📖 Translate</text>
    </g>

    <!-- Button: AI (Highlight) -->
    <g transform="translate(280, 12)">
      <rect width="66" height="30" rx="8" fill="#3b82f6" fill-opacity="0.3" stroke="#60a5fa" stroke-width="1" />
      <text x="14" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#93c5fd">✦ AI</text>
    </g>

    <!-- Button: JSON -->
    <g transform="translate(354, 12)">
      <rect width="76" height="30" rx="8" fill="#ffffff" fill-opacity="0.08" />
      <text x="14" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#ffffff">{ } JSON</text>
    </g>

    <!-- Divider -->
    <line x1="442" y1="16" x2="442" y2="38" stroke="#ffffff" stroke-opacity="0.15" />

    <!-- Button: More -->
    <g transform="translate(454, 12)">
      <rect width="72" height="30" rx="8" fill="#ffffff" fill-opacity="0.08" />
      <text x="16" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">⋯ More</text>
    </g>

    <text x="540" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="400" fill="#64748b">
      Non-activating HUD
    </text>
  </g>
</svg>
